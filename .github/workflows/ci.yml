name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json

      - name: Install api deps
        working-directory: services/api
        run: npm install

      - name: Debug - check secrets are present
        run: |
          echo "SUPABASE_URL is set: ${{ secrets.SUPABASE_URL != '' }}"
          echo "JWT_SECRET is set: ${{ secrets.JWT_SECRET != '' }}"

      # SUPABASE_* secrets need to be added under Settings -> Secrets and
      # variables -> Actions for the db-dependent tests to actually run.
      # without them, those tests skip cleanly instead of failing - see
      # tests/booking.test.js.
      - name: Run tests
        working-directory: services/api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm test

  audit-test:
    name: Audit service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: services/audit/package-lock.json

      - name: Install audit deps
        working-directory: services/audit
        run: npm install

      - name: Run tests
        working-directory: services/audit
        run: npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build (api + audit)
    runs-on: ubuntu-latest
    needs: [api-test, audit-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        working-directory: services/api
        run: docker build -t booking-api:ci .

      - name: Build audit image
        working-directory: services/audit
        run: docker build -t audit-service:ci .